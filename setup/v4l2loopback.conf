# Install as /etc/modprobe.d/papercam-v4l2loopback.conf
# (and add "v4l2loopback" to /etc/modules-load.d/papercam.conf)
#
# video_nr=10        -> device appears as /dev/video10 (LOOPBACK_DEVICE in config.py)
# exclusive_caps=1   -> device only advertises capture once a producer connects,
#                       so uvc-gadget sees a real source
options v4l2loopback video_nr=10 card_label="papercam" exclusive_caps=1
